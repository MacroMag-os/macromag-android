name: Build MacroMag OS Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MacroMag-Android
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch latest ARM64 rootfs from MacroMag-32 ISO
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full cpio gzip
          mkdir -p work rootfs_extract app/src/main/assets

          ISO_URL="https://github.com/MacroMag-os/MacroMag-32/releases/latest/download/MacroMag-aarch64.iso"
          echo "Pobieranie ISO: $ISO_URL"
          curl -fSL "$ISO_URL" -o work/macromag.iso

          7z x work/macromag.iso -owork/iso_files
          INITRD=$(find work/iso_files -name 'initramfs*' | head -n 1)
          if [ -z "$INITRD" ]; then
            echo "BLAD: Nie znaleziono initramfs w obrazie ISO!"
            ls -laR work/iso_files
            exit 1
          fi

          echo "Rozpakowywanie initramfs: $INITRD"
          (cd rootfs_extract && gzip -dc "../$INITRD" | cpio -idmv)
          tar -czf app/src/main/assets/macromag-arm64-rootfs.tar.gz -C rootfs_extract .

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-android
          name: "MacroMag OS Android APK"
          files: app/build/outputs/apk/debug/app-debug.apk
