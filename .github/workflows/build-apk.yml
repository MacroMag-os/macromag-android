name: Build MacroMag OS Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MacroMag-Android
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore app/release.keystore -alias macromag -keyalg RSA -keysize 2048 -validity 10000 -storepass MacroMag2026 -keypass MacroMag2026 -dname "CN=MacroMag OS, OU=Dev, O=MacroMag-os, L=Gniezno, ST=Wielkopolskie, C=PL"

      - name: Fetch latest ARM64 rootfs from MacroMag-32 ISO
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full cpio gzip
          mkdir -p work rootfs_extract app/src/main/assets
          ISO_URL="https://github.com"
          curl -fSL "$ISO_URL" -o work/macromag.iso
          7z x work/macromag.iso -owork/iso_files
          INITRD=$(find work/iso_files -name 'initramfs*' | head -n 1)
          (cd rootfs_extract && gzip -dc "../$INITRD" | cpio -idmv)
          tar -czf app/src/main/assets/macromag-arm64-rootfs.tar.gz -C rootfs_extract .

      - name: Build and Sign Release APK
        run: |
          gradle assembleRelease --info
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -n 1)
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          $ZIPALIGN -f -p 4 "$UNSIGNED_APK" MacroMag-aligned.apk
          $APKSIGNER sign --ks app/release.keystore --ks-pass pass:MacroMag2026 --ks-key-alias macromag --key-pass pass:MacroMag2026 --out MacroMag-OS-v1.0.1-release.apk MacroMag-aligned.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1-android
          name: "MacroMag OS Android APK (Signed Release)"
          files: MacroMag-OS-v1.0.1-release.apk
